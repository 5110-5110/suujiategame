<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒット＆ブロー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <div class="game-header">
      <h1>Hit & Blow</h1>
      <p class="rule">0〜9の数字を使った、重複なしの3桁を当てよう！<br>
        <strong>ヒット</strong>：数字も位置も正解 / <strong>ブロー</strong>：数字だけ正解</p>
    </div>

    <section class="input-area">
      <div id="slots" class="slots" aria-label="入力中の数字"></div>
      <div id="keypad" class="keypad"></div>
      <div class="actions">
        <button id="delete-btn" type="button" class="sub">1文字消す</button>
        <button id="submit-btn" type="button" class="main">予想する</button>
      </div>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="history-area">
      <h2><span>履歴</span> <span id="count"></span></h2>
      <ol id="history" class="history"></ol>
    </section>

    <button id="restart-btn" type="button" class="sub restart">最初からやり直す</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
