<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒットアンドブロー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>ヒットアンドブロー</h1>
    <p class="rule">0〜9の数字を使った重複なしの3桁を当てよう。<br>
      <strong>ヒット</strong>は数字も位置も正解、<strong>ブロー</strong>は数字だけ正解です。</p>

    <section class="input-area">
      <div id="slots" class="slots" aria-label="入力中の数字"></div>
      <div id="keypad" class="keypad"></div>
      <div class="actions">
        <button id="delete-btn" type="button" class="sub">1文字消す</button>
        <button id="submit-btn" type="button" class="main">予想する</button>
      </div>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="history-area">
      <h2>履歴 <span id="count"></span></h2>
      <ol id="history" class="history"></ol>
    </section>

    <button id="restart-btn" type="button" class="sub restart">最初からやり直す</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
